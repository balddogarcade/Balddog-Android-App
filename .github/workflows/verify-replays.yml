name: Verify Replays

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Maximum pending replays to process in this run'
        required: false
        default: '10'
  repository_dispatch:
    types: [verify-replays]

concurrency:
  group: verify-replays-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_pending: ${{ steps.check.outputs.has_pending }}
    steps:
      - name: Check pending replay queue
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(curl -sS -G "${SUPABASE_URL%/}/rest/v1/high_scores" \
            --data-urlencode "select=id" \
            --data-urlencode "verification_status=in.(pending,verifying)" \
            --data-urlencode "limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" | python3 -c "import sys, json; data = json.load(sys.stdin); print(len(data) if isinstance(data, list) else 0)")
          if [ "$COUNT" -gt 0 ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check-queue
    if: needs.check-queue.outputs.has_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Linux FBNeo core
        id: cache-fbneo-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/fbneo-linux/fbneo_libretro.so
          key: fbneo-linux-5f6bdff9451d5c3dedd3d992d7412660eb202cf4

      - name: Build Linux FBNeo core
        if: steps.cache-fbneo-linux.outputs.cache-hit != 'true'
        run: bash ./scripts/build-fbneo-linux.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Build verify_replay binary
        run: cargo build --manifest-path rust/Cargo.toml --release -p balddog-core --bin verify_replay

      - name: Cache downloaded ROMs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/roms-verify
          key: verify-roms-${{ github.run_id }}
          restore-keys: |
            verify-roms-

      - name: Run replay verification worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FBNEO_CORE_PATH: .cache/fbneo-linux/fbneo_libretro.so
          VERIFIER_BIN: rust/target/release/verify_replay
          ROMS_DIR: .cache/roms-verify
          ONCE: '1'
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: python3 scripts/verify-replays-worker.py
