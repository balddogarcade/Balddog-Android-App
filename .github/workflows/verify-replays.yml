name: Verify Replays

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Maximum pending replays to process in this run'
        required: false
        default: '10'
  repository_dispatch:
    types: [verify-replays]

concurrency:
  group: verify-replays-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Linux FBNeo core
        id: cache-fbneo-linux
        uses: actions/cache@v4
        with:
          path: .cache/fbneo-linux/fbneo_libretro.so
          key: fbneo-linux-5f6bdff9451d5c3dedd3d992d7412660eb202cf4

      - name: Build Linux FBNeo core
        if: steps.cache-fbneo-linux.outputs.cache-hit != 'true'
        run: bash ./scripts/build-fbneo-linux.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build verify_replay binary
        run: cargo build --manifest-path rust/Cargo.toml --release -p balddog-core --bin verify_replay

      - name: Cache downloaded ROMs
        uses: actions/cache@v4
        with:
          path: .cache/roms-verify
          key: verify-roms-${{ github.run_id }}
          restore-keys: |
            verify-roms-

      - name: Run replay verification worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FBNEO_CORE_PATH: .cache/fbneo-linux/fbneo_libretro.so
          VERIFIER_BIN: rust/target/release/verify_replay
          ROMS_DIR: .cache/roms-verify
          ONCE: '1'
          BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: python3 scripts/verify-replays-worker.py
